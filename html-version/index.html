<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="数字信号处理综合分析 Web 应用，包含典型离散序列、采样与插值重构、Z 变换零极点、DFS、DFT、频域采样、CZT、DFT 应用与 FFT。"
    />
    <title>数字信号处理综合分析器</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-block panel">
          <p class="eyebrow">DSP Analysis Studio</p>
          <h1>数字信号处理综合分析器</h1>
          <p class="brand-block__text">
            典型序列、采样重构、Z 变换、DFS、DFT、CZT、DFT 应用与 FFT 一页联动展示。
          </p>
        </div>

        <section class="topbar-nav panel">
          <nav class="module-switcher" aria-label="总导航">
            <button type="button" class="module-switcher__button active" data-main-module="foundation">
              基础分析
            </button>
            <button type="button" class="module-switcher__button" data-main-module="extensions">
              扩展变换
            </button>
            <button type="button" class="module-switcher__button" data-main-module="dft-apps">
              DFT应用
            </button>
            <button type="button" class="module-switcher__button" data-main-module="fft">
              FFT
            </button>
          </nav>

          <nav id="foundation-subnav" class="section-switcher" aria-label="基础分析功能切换">
            <button type="button" class="section-switcher__button active" data-section="discrete">
              典型离散序列
            </button>
            <button type="button" class="section-switcher__button" data-section="sampling">
              采样与插值重构
            </button>
            <button type="button" class="section-switcher__button" data-section="zplane">
              Z变换零极点
            </button>
          </nav>
        </section>

        <label class="upload-shortcut panel" for="global-upload">
          <input
            id="global-upload"
            type="file"
            accept=".txt,.csv,audio/*,video/*"
          />
          <span class="upload-shortcut__title">上传信号 / 音频 / 视频文件</span>
          <span class="upload-shortcut__meta">保留原信号预览与后续分析接口</span>
        </label>
      </header>

      <section id="module-foundation" class="module-panel active">
        <main class="content-grid">
          <aside class="sidebar panel">
            <div class="panel__header sidebar__header">
              <div>
                <p id="sidebar-eyebrow" class="eyebrow"></p>
                <h2 id="sidebar-title"></h2>
              </div>
            </div>
            <p id="sidebar-description" class="sidebar__description"></p>
            <div id="sequence-list" class="sequence-list"></div>
          </aside>

          <section class="workspace">
            <section class="panel controls-panel">
              <div class="panel__header">
                <div>
                  <p class="eyebrow">分析控制</p>
                  <h2 id="control-title">范围、自定义输入与参数</h2>
                </div>
                <button id="reset-button" type="button" class="text-button">
                  恢复当前模块默认参数
                </button>
              </div>
              <div id="section-controls" class="section-controls"></div>
              <p class="drag-tip">可拖动右侧图形平移范围，查看不同区间下的曲线。</p>
            </section>

            <section class="overview-grid">
              <section class="panel">
                <div class="panel__header">
                  <div>
                    <p class="eyebrow">当前分析对象</p>
                    <h2 id="summary-title"></h2>
                  </div>
                  <span id="summary-chip" class="panel-chip"></span>
                </div>
                <div id="summary-body" class="summary-body"></div>
              </section>

              <section class="panel">
                <div class="panel__header">
                  <div>
                    <p class="eyebrow">上传与原信号预览</p>
                    <h2>文件接口</h2>
                  </div>
                </div>
                <div id="upload-preview" class="upload-preview"></div>
              </section>
            </section>

            <section id="metric-grid" class="metric-grid"></section>

            <section id="chart-grid" class="chart-grid"></section>

            <section class="detail-grid">
              <section class="panel">
                <div class="panel__header">
                  <div>
                    <p class="eyebrow">结果采样</p>
                    <h2 id="table-title"></h2>
                  </div>
                </div>
                <div id="table-area" class="table-area"></div>
              </section>

              <section class="panel">
                <div class="panel__header">
                  <div>
                    <p class="eyebrow">说明与约束</p>
                    <h2>说明</h2>
                  </div>
                </div>
                <div id="notes-area" class="notes-area"></div>
              </section>
            </section>
          </section>
        </main>
      </section>

      <section id="module-extensions" class="module-panel">
        <section class="extension-lab">
          <section class="panel extension-lab__header">
            <div class="panel__header">
              <div>
                <p class="eyebrow">扩展理论与变换实验区</p>
                <h2>DFS、DFT、频域采样定理与 CZT</h2>
              </div>
              <span class="panel-chip">保留原功能基础上继续扩展</span>
            </div>
            <nav class="extension-topic-switcher" aria-label="扩展主题切换">
              <button type="button" class="extension-topic-switcher__button active" data-extension-topic="dfs">
                周期序列 DFS
              </button>
              <button type="button" class="extension-topic-switcher__button" data-extension-topic="dft">
                有限序列 DFT
              </button>
              <button type="button" class="extension-topic-switcher__button" data-extension-topic="sampling">
                频域采样定理
              </button>
              <button type="button" class="extension-topic-switcher__button" data-extension-topic="czt">
                线性调频 Z 变换
              </button>
            </nav>
          </section>

          <section id="extension-root" class="extension-topic-grid">
            <aside class="panel extension-theory">
              <div class="panel__header">
                <div>
                  <p class="eyebrow">定义与性质</p>
                  <h2 id="extension-topic-title"></h2>
                </div>
              </div>
              <p id="extension-topic-description" class="sidebar__description"></p>
              <div id="extension-theory-list" class="extension-theory-list"></div>
            </aside>

            <section class="panel extension-content-panel">
              <div id="extension-content"></div>
            </section>
          </section>
        </section>
      </section>

      <section id="module-dft-apps" class="module-panel">
        <section class="extension-lab">
          <section class="panel extension-lab__header">
            <div class="panel__header">
              <div>
                <p class="eyebrow">新增板块</p>
                <h2>离散傅里叶变换的应用</h2>
              </div>
              <span class="panel-chip">点击导航切换功能</span>
            </div>
            <nav class="extension-topic-switcher" aria-label="DFT 应用功能切换">
              <button type="button" class="extension-topic-switcher__button active" data-dft-app-topic="distortion">
                频谱近似与失真
              </button>
              <button type="button" class="extension-topic-switcher__button" data-dft-app-topic="convolution">
                卷积与分块法
              </button>
              <button type="button" class="extension-topic-switcher__button" data-dft-app-topic="correlation">
                线性相关
              </button>
              <button type="button" class="extension-topic-switcher__button" data-dft-app-topic="cases">
                工程案例
              </button>
            </nav>
          </section>

          <section id="dft-app-root" class="extension-topic-grid">
            <aside class="panel extension-theory">
              <div class="panel__header">
                <div>
                  <p class="eyebrow">定义与性质</p>
                  <h2 id="dft-app-topic-title"></h2>
                </div>
              </div>
              <p id="dft-app-topic-description" class="sidebar__description"></p>
              <div id="dft-app-theory-list" class="extension-theory-list"></div>
            </aside>

            <section class="panel extension-content-panel">
              <div id="dft-app-content"></div>
            </section>
          </section>
        </section>
      </section>

      <section id="module-fft" class="module-panel">
        <section class="extension-lab">
          <section class="panel extension-lab__header">
            <div class="panel__header">
              <div>
                <p class="eyebrow">新增板块</p>
                <h2>快速傅里叶变换 FFT</h2>
              </div>
              <span class="panel-chip">复杂度、DIT、DIF</span>
            </div>
            <nav class="extension-topic-switcher" aria-label="FFT 功能切换">
              <button type="button" class="extension-topic-switcher__button active" data-fft-topic="complexity">
                运算瓶颈对比
              </button>
              <button type="button" class="extension-topic-switcher__button" data-fft-topic="dit">
                DIT FFT
              </button>
              <button type="button" class="extension-topic-switcher__button" data-fft-topic="dif">
                DIF FFT
              </button>
            </nav>
          </section>

          <section id="fft-root" class="extension-topic-grid">
            <aside class="panel extension-theory">
              <div class="panel__header">
                <div>
                  <p class="eyebrow">定义与性质</p>
                  <h2 id="fft-topic-title"></h2>
                </div>
              </div>
              <p id="fft-topic-description" class="sidebar__description"></p>
              <div id="fft-theory-list" class="extension-theory-list"></div>
            </aside>

            <section class="panel extension-content-panel">
              <div id="fft-content"></div>
            </section>
          </section>
        </section>
      </section>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
